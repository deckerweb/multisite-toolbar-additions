name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find src includes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l multisite-toolbar-additions.php
      - run: php tests/unit.php
