name: Release 4.0.0
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'deckerweb/multisite-toolbar-additions' && startsWith(github.event.head_commit.message, 'Release 4.0.0')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find src includes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l multisite-toolbar-additions.php
      - run: php tests/unit.php
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build installable and source packages
        run: python3 tools/package.py dist
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.0.0 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it.'
            exit 1
          fi
          gh release create v4.0.0 dist/multisite-toolbar-additions-4.0.0.zip dist/multisite-toolbar-additions-4.0.0-source.zip dist/SHA256SUMS --target "$GITHUB_SHA" --title 'Multisite Toolbar Additions 4.0.0' --notes-file RELEASE-NOTES.md --latest
